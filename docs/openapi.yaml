openapi: 3.0.3
info:
  title: MEBELCHI AI API
  version: 1.0.0
  description: Furniture design, calculation and production automation. No external
    AI services.
paths:
  /api/v1/admin-api/audit-logs/:
    get:
      operationId: admin_api_audit_logs_list
      description: 'Platform administrators only. Read-only: audit entries cannot
        be changed or deleted through the API.'
      parameters:
      - in: query
        name: action
        schema:
          type: string
          enum:
          - create
          - delete
          - login
          - logout
          - password
          - update
        description: |-
          * `create` - Created
          * `update` - Updated
          * `delete` - Deleted
          * `login` - Logged in
          * `logout` - Logged out
          * `password` - Password changed
      - in: query
        name: actor
        schema:
          type: integer
      - in: query
        name: actor_email
        schema:
          type: string
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
      - in: query
        name: event
        schema:
          type: string
      - in: query
        name: model
        schema:
          type: string
      - in: query
        name: object_id
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin-api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
  /api/v1/admin-api/audit-logs/{id}/:
    get:
      operationId: admin_api_audit_logs_retrieve
      description: 'Platform administrators only. Read-only: audit entries cannot
        be changed or deleted through the API.'
      parameters:
      - in: path
