  /api/v1/admin-api/subscriptions/:
    get:
      operationId: admin_api_subscriptions_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: plan__slug
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - cancelled
        description: |-
          * `active` - Active
          * `cancelled` - Cancelled
      tags:
      - admin-api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminSubscriptionList'
          description: ''
  /api/v1/admin-api/subscriptions/{id}/:
    get:
      operationId: admin_api_subscriptions_retrieve
      parameters:
      - in: path
        name: id
