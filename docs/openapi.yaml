openapi: 3.0.3
info:
  title: MEBELCHI AI API
  version: 1.0.0
  description: Furniture design, calculation and production automation. No external
    AI services.
paths:
  /api/v1/admin-api/broadcast/:
    post:
      operationId: admin_api_broadcast_create
      tags:
      - admin-api
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: {}
          multipart/form-data:
            schema:
              type: object
              additionalProperties: {}
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/admin-api/features/:
    get:
      operationId: admin_api_features_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - admin-api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Feature'
          description: ''
    post:
      operationId: admin_api_features_create
      tags:
      - admin-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Feature'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Feature'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Feature'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
          description: ''
  /api/v1/admin-api/features/{id}/:
    get:
      operationId: admin_api_features_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this feature flag.
        required: true
      tags:
      - admin-api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
          description: ''
    put:
      operationId: admin_api_features_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this feature flag.
        required: true
      tags:
      - admin-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Feature'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Feature'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Feature'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
          description: ''
    patch:
      operationId: admin_api_features_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this feature flag.
        required: true
      tags:
      - admin-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedFeature'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedFeature'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedFeature'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feature'
          description: ''
    delete:
      operationId: admin_api_features_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this feature flag.
        required: true
      tags:
      - admin-api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/admin-api/logs/:
    get:
      operationId: admin_api_logs_list
      parameters:
      - in: query
        name: level
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status_code
        schema:
          type: integer
      tags:
      - admin-api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLogList'
          description: ''
  /api/v1/admin-api/logs/{id}/:
    get:
      operationId: admin_api_logs_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this system log.
        required: true
      tags:
      - admin-api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Log'
          description: ''
  /api/v1/admin-api/payments/:
    get:
      operationId: admin_api_payments_list
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - paid
          - pending
          - rejected
        description: |-
          * `pending` - Pending
          * `paid` - Paid
          * `rejected` - Rejected
      tags:
      - admin-api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminPaymentList'
          description: ''
  /api/v1/admin-api/payments/{id}/:
    get:
      operationId: admin_api_payments_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this payment.
        required: true
      tags:
      - admin-api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPayment'
          description: ''
  /api/v1/admin-api/payments/{id}/confirm/:
    post:
      operationId: admin_api_payments_confirm_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this payment.
        required: true
      tags:
      - admin-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPayment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminPayment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminPayment'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPayment'
          description: ''
  /api/v1/admin-api/payments/{id}/reject/:
    post:
      operationId: admin_api_payments_reject_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this payment.
        required: true
      tags:
      - admin-api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminPayment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AdminPayment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AdminPayment'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPayment'
          description: ''
  /api/v1/admin-api/projects/:
    get:
      operationId: admin_api_projects_list
      parameters:
      - in: query
        name: category
        schema:
          type: string
          enum:
          - bedroom
          - cabinet
          - kitchen
          - living
          - office
          - other
          - tv_unit
          - wardrobe
        description: |-
          * `cabinet` - Cabinet
          * `kitchen` - Kitchen
          * `wardrobe` - Wardrobe
          * `tv_unit` - TV unit
          * `bedroom` - Bedroom
          * `office` - Office
          * `living` - Living room
          * `other` - Other
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - archived
        description: |-
          * `active` - Active
          * `archived` - Archived
      tags:
      - admin-api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdminProjectList'
          description: ''
