# Every job must pass; a failing test, migration drift, a failing deploy check, a broken image build or a broken backup/restore fails
# the pipeline. The numbers to defend (Phase 3 baseline): 508 backend tests, 157 frontend tests, plus everything added since.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-postgres:
    name: Backend (Python 3.12, PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mebelchi_ci
          POSTGRES_USER: mebelchi
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mebelchi -d mebelchi_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ENGINE: postgresql
      POSTGRES_DB: mebelchi_ci
      POSTGRES_USER: mebelchi
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      DATABASE_FALLBACK_ENABLED: "false"
      # manage.py needs a key outside `test` mode; this one exists only inside CI
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789-abcdefghijklmnopqrstuvwxyz
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Migrations are in sync with the models
        run: python manage.py makemigrations --check --dry-run
      - name: Migrate an empty PostgreSQL (includes the audit append-only trigger)
        run: python manage.py migrate --noinput
      - name: Tests
        run: python manage.py test --noinput
      - name: Deploy check (production-like settings; fails on errors, prints warnings)
        env:
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: example.com
        run: python manage.py check --deploy

  backend-sqlite:
    name: Backend (Python 3.12, SQLite)
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py test --noinput

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Tests
        run: npm test

  telegram-bot:
    name: Telegram bot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: telegram_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: telegram_bot/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  backup-restore:
    name: Backup, restore and release gate (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mebelchi_ci
          POSTGRES_USER: mebelchi
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mebelchi -d mebelchi_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_ENGINE: postgresql
      POSTGRES_DB: mebelchi_ci
      POSTGRES_USER: mebelchi
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
      DATABASE_FALLBACK_ENABLED: "false"
      # manage.py needs a key outside `test` mode; this one exists only inside CI
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-0123456789-abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 16 client tools (pg_dump must not be older than the server)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -q && sudo apt-get install -y -q postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Real schema (with the audit trigger) to back up
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: backup.sh / restore.sh end to end
        env:
          PGPASSWORD: ci-only-password
        run: sh deploy/tests/test_backup_restore.sh

  docker:
    name: Docker images and compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: compose file is valid and the deploy plan prints
        run: |
          cp .env.example .env
          docker compose config -q
          sh deploy/deploy.sh --dry-run
      - name: Images build (backend runs on python:3.12-slim)
        run: docker compose build
