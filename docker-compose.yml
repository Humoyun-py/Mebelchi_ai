# MEBELCHI AI production-style stack. Copy .env.example to .env first.
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
  volumes:
    - media:/app/media
  # `release` (migrations) must have finished successfully; if it fails the deploy stops and the running containers are left alone.
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }
    release: { condition: service_completed_successfully }
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # One-shot release step: the only place that migrates. Refuses to migrate an existing database without a verified backup.
  # Normal use is deploy/deploy.sh; by hand: docker compose run --rm backup once && docker compose run --rm release
  release:
    build: ./backend
    env_file: .env
    environment:
      POSTGRES_HOST: db
      BACKUP_MAX_AGE_MINUTES: ${BACKUP_MAX_AGE_MINUTES:-120}
    command: ["sh", "/app/release.sh"]
    volumes:
      - static:/app/staticfiles
      - backups:/backups:ro
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  backend:
    <<: *backend
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      # nginx overwrites X-Real-IP with the real peer address; the backend port is not published, so the header cannot be forged.
      AUDIT_IP_HEADER: HTTP_X_REAL_IP
    volumes:
      - media:/app/media
      - static:/app/staticfiles

  worker:
    <<: *backend
    command: celery -A config worker -l info

  beat:
    <<: *backend
    command: celery -A config beat -l info

  telegram-bot:
    build: ./telegram_bot
    env_file: .env
    environment:
      API_BASE_URL: http://backend:8000/api/v1
      REDIS_URL: redis://redis:6379/1
    depends_on:
      backend: { condition: service_started }
      redis: { condition: service_started }
    restart: unless-stopped

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - static:/var/www/static:ro
    depends_on:
      - backend
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_KEEP_MIN: ${BACKUP_KEEP_MIN:-3}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_OFFSITE_DIR: ${BACKUP_OFFSITE_DIR:-}
      BACKUP_POST_HOOK: ${BACKUP_POST_HOOK:-}
      BACKUP_ALERT_WEBHOOK_URL: ${BACKUP_ALERT_WEBHOOK_URL:-}
      BACKUP_ALERT_TELEGRAM_BOT_TOKEN: ${BACKUP_ALERT_TELEGRAM_BOT_TOKEN:-}
      BACKUP_ALERT_TELEGRAM_CHAT_ID: ${BACKUP_ALERT_TELEGRAM_CHAT_ID:-}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - backups:/backups
      - media:/media:ro
    # unhealthy when no verified backup was written within BACKUP_HEALTH_MAX_MIN (default: a day and an hour)
    healthcheck:
      test: ["CMD-SHELL", "find /backups/LATEST_OK -mmin -${BACKUP_HEALTH_MAX_MIN:-1500} 2>/dev/null | grep -q ."]
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 15m
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  media:
  static:
  backups:
