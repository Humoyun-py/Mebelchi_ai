# MEBELCHI AI production-style stack. Copy .env.example to .env first.
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
  volumes:
    - media:/app/media
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    <<: *backend
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "1"
      # nginx overwrites X-Real-IP with the real peer address; the backend port is not published, so the header cannot be forged.
      AUDIT_IP_HEADER: HTTP_X_REAL_IP
    volumes:
      - media:/app/media
      - static:/app/staticfiles

  worker:
    <<: *backend
    command: celery -A config worker -l info

  beat:
    <<: *backend
    command: celery -A config beat -l info

  web:
    build: ./frontend
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - static:/var/www/static:ro
    depends_on:
      - backend
    restart: unless-stopped

  backup:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - backups:/backups
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  media:
  static:
  backups:
